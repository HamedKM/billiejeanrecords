<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billie Jean Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: the label's own identity on a bright page. Black condensed type like the BJR logo, tiger orange for action, tiger yellow for light, real studio photos. */
:root{
  --ink:#f5f3f8; --stage:#ffffff; --raise:#efebf4; --line:#e2dcea;
  --text:#17131d; --mute:#6a6377;
  --hot:#f05a00; --amber:#a85a00; --amberFill:#ffb21a; --ok:#11885a; --warn:#b86e00; --bad:#d23a3a; --violet:#5f45cc;
  --display:"Oswald", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.005em;text-transform:uppercase}
h1{font-size:clamp(2.4rem,6vw,4.6rem);font-weight:800}
h2{font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.mute{color:var(--mute)}
.small{font-size:.85rem}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700}

/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(245,243,248,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;letter-spacing:.02em;font-size:1.05rem;white-space:nowrap}
.brand i{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.brand img{height:40px;width:auto;display:block}
.brand i b{width:7px;height:7px;border-radius:1px;background:var(--raise)}
.brand i b:nth-child(1),.brand i b:nth-child(5),.brand i b:nth-child(9){background:var(--hot)}
.brand i b:nth-child(3),.brand i b:nth-child(7){background:var(--amberFill)}
nav.main{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}
nav.main a{text-decoration:none;padding:8px 12px;border-radius:999px;color:var(--mute);font-weight:600;font-size:.92rem}
nav.main a:hover,nav.main a.on{color:var(--text);background:var(--raise)}
.cartlink{position:relative}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--hot);color:#fff;font-size:.72rem;font-weight:700;margin-left:4px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 10px;font-size:.8rem;font-weight:700;color:var(--mute);cursor:pointer}
.lang button.on{background:var(--text);color:var(--ink)}
@media (max-width:760px){.bar{height:auto;flex-wrap:wrap;padding:10px 0}nav.main{margin-left:0;width:100%}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;font-size:.95rem;transition:transform .12s, background .12s}
.btn:hover{transform:translateY(-1px)}
.btn.hot{background:var(--hot);color:#fff}
.btn.light{background:var(--text);color:var(--ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--mute)}
.btn.sm{padding:7px 14px;font-size:.85rem}
.btn.ok{background:var(--ok);color:#06210f}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 30%,rgba(245,243,248,.55) 70%,rgba(245,243,248,.2))}
.hero .wrap{position:relative;padding-top:56px;padding-bottom:56px;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;max-width:1180px}
.hero .txt{display:grid;gap:22px}
.hero .pic{border-radius:18px;overflow:hidden;aspect-ratio:4/3}
.hero .pic img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}}
.hero h1 em{font-style:normal;color:var(--hot)}
.hero p{max-width:58ch;color:var(--text);font-size:1.1rem;margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

section.block{padding:64px 0;border-bottom:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}

/* journey */
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.journey a{padding:20px 16px;text-decoration:none;border-right:1px solid var(--line);display:grid;gap:6px;background:var(--stage)}
.journey a:last-child{border-right:0}
.journey a:hover{background:var(--raise)}
.journey .n{font-family:var(--display);font-size:2rem;font-weight:800;color:var(--hot);line-height:1}
.journey b{font-family:var(--display);font-size:1.1rem}
@media (max-width:860px){.journey{grid-template-columns:repeat(2,1fr)}.journey a{border-bottom:1px solid var(--line)}}

/* categories & cards */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cat .cimg{margin:-20px -20px 4px;height:150px;overflow:hidden}.cat .cimg img{width:100%;height:100%;object-fit:cover;display:block}
.cat{overflow:hidden;background:var(--stage);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:10px;text-decoration:none;cursor:pointer;text-align:left}
.cat:hover{border-color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;width:120px}
.tiles b{aspect-ratio:1;border-radius:2px;background:var(--raise)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--mute)}
.chip.on{background:var(--text);color:var(--ink);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--stage);box-shadow:0 1px 2px rgba(23,19,29,.04);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-decoration:none}
.card:hover{border-color:var(--mute)}
.card .art{height:150px;position:relative;background:var(--raise)}
.card .art img,.photo img{width:100%;height:100%;object-fit:cover;display:block}
.card .art canvas{width:100%;height:100%;display:block}
.card .body{padding:16px;display:grid;gap:8px;flex:1}
.card .foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);font-size:.88rem}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.book{color:var(--amber);border-color:rgba(184,110,0,.35)}
.tag.buy{color:var(--ok);border-color:rgba(17,136,90,.35)}
.tag.quote{color:var(--violet);border-color:rgba(95,69,204,.35)}

/* service page */
.svc{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;padding:44px 0}
@media (max-width:900px){.svc{grid-template-columns:1fr}}
.svc>*,.cols>*,.related>*{min-width:0}
.crumbs{font-size:.85rem;color:var(--mute);margin-bottom:14px}
.crumbs a{color:var(--mute)}
.panel{background:var(--stage);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.offer{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.offer:last-child{border-bottom:0}
.offer .p{font-family:var(--display);font-weight:700;font-size:1.15rem}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--mute);font-size:.88rem}
.seg button.on{background:var(--raise);color:var(--text)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:center;min-width:58px}
.day b{display:block;font-family:var(--display);font-size:1.15rem}
.day.on{background:var(--hot);border-color:var(--hot);color:#fff}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.time{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 0;cursor:pointer;font-weight:600;font-size:.88rem}
.time.on{background:var(--amberFill);color:#17131d;border-color:var(--amberFill)}
.time[disabled]{opacity:.25;cursor:not-allowed;text-decoration:line-through}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:1.1rem}
.timeline{position:relative;height:34px;background:var(--raise);border-radius:8px;overflow:hidden}
.timeline .blk{position:absolute;top:4px;bottom:4px;border-radius:5px;background:rgba(23,19,29,.75)}
.timeline .blk.pend{background:transparent;border:1.5px dashed var(--amber)}
.timeline .blk.mine{background:var(--amberFill)}
.tl-scale{display:flex;justify-content:space-between;font-size:.7rem;color:var(--mute);margin-top:4px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.total .p{font-family:var(--display);font-size:1.6rem}
.related{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
@media (max-width:900px){.related{grid-template-columns:1fr}}
.rel{background:var(--stage);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.rel a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;padding:10px 12px;border-radius:10px;background:var(--raise);font-weight:600;font-size:.92rem}
.rel a:hover{outline:1px solid var(--mute)}
.note{border-left:3px solid var(--amberFill);padding:10px 14px;background:rgba(255,191,77,.14);border-radius:0 10px 10px 0;font-size:.9rem}
.note.req{border-color:var(--violet);background:rgba(95,69,204,.07)}

/* forms */
label.f{display:grid;gap:6px;font-size:.85rem;font-weight:600;color:var(--mute)}
input.i,select.i,textarea.i{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);width:100%}
textarea.i{min-height:110px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:4px;accent-color:var(--hot)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.two{grid-template-columns:1fr}}

/* lists */
.list{display:grid;gap:10px}
.item{background:var(--stage);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.pill.confirmed,.pill.paid,.pill.booked{background:rgba(17,136,90,.12);color:var(--ok)}
.pill.pending,.pill.new,.pill.meeting,.pill.priced,.pill.move{background:rgba(255,191,77,.25);color:var(--amber)}
.pill.refused,.pill.impossible{background:rgba(210,58,58,.1);color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 24px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.cols{grid-template-columns:1fr}}
.agenda{background:var(--stage);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.agenda .slot{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.sms{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.empty{padding:30px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r)}
.demo{background:repeating-linear-gradient(45deg,rgba(255,191,77,.16) 0 10px,transparent 10px 20px);border:1px solid rgba(184,110,0,.3);border-radius:12px;padding:12px 16px;font-size:.88rem}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(23,19,29,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--stage);border:1px solid var(--line);border-radius:18px;max-width:440px;width:100%;padding:24px;display:grid;gap:14px}
.ctp{background:#f7f7f9;border:1px solid var(--line);color:#1a1a1a;border-radius:12px;padding:16px;display:grid;gap:10px}
.ctp .hd{display:flex;justify-content:space-between;font-weight:700}
.ctp input{background:#f3f3f3;border:1px solid #ddd;border-radius:8px;padding:10px;color:#1a1a1a}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:60;max-width:360px}
.toast{background:var(--raise);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:10px;padding:10px 14px;font-size:.85rem;box-shadow:0 10px 30px rgba(23,19,29,.12)}
footer{padding:40px 0;color:var(--mute);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function priceHours(r,h){ // best combination of 8h, 4h, 1h packs
 const best=[0];for(let i=1;i<=h;i++){let v=best[i-1]+r[1];if(i>=4)v=Math.min(v,best[i-4]+r[4]);if(i>=8)v=Math.min(v,best[i-8]+r[8]);best[i]=v}return best[h];
}
const blocking=(room,date,except)=>st.bookings.filter(b=>b.room===room&&b.date===date&&b.status==="confirmed"&&b.id!==except);
function free(room,date,start,dur,except){
 const end=start+dur*60;if(start<OPEN||end>CLOSE)return false;
 if(date===addDays(0)){const n=new Date();if(start<=n.getHours()*60+n.getMinutes())return false}
 return blocking(room,date,except).every(b=>end+BUFFER<=b.start||b.start+b.dur*60+BUFFER<=start);
}
function nextFree(room){for(let d=0;d<14;d++){const k=addDays(d);for(let m=OPEN;m<=CLOSE-60;m+=30)if(free(room,k,m,1))return {k,m}}return null}

 let s=0;for(const ch of seedStr)s=(s*31+ch.charCodeAt(0))>>>0;const rnd=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;

 const size=46;const cols=Math.ceil(c.width/size)+1,rows=Math.ceil(c.height/size)+1;const lit=new Map();
 const draw=()=>{x.clearRect(0,0,c.width,c.height);for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){const k=i+","+j,v=lit.get(k)||0;x.fillStyle=v>0?`rgba(${224+Math.round(31*(1-v))},${30+Math.round(161*(1-v))},${102-Math.round(25*(1-v))},${.2+.7*v})`:"rgba(226,220,234,.75)";x.fillRect(i*size+3,j*size+3,size-6,size-6)}};

}

  body=`<div class="days" style="margin-bottom:16px">${[...Array(14)].map((_,i)=>addDays(i)).map(k=>{const dt=new Date(k+"T12:00:00");return `<button class="day ${d===k?"on":""}" data-aday="${k}"><span class="small">${dt.toLocaleDateString(L()==="fr"?"fr-FR":"en-GB",{weekday:"short"})}</span><b class="num">${dt.getDate()}</b></button>`}).join("")}</div>
  <div class="cols">${["rec","dj"].map(r=>{const list=st.bookings.filter(b=>b.room===r&&b.date===d&&b.status!=="refused").sort((a,b)=>a.start-b.start);
   return `<div class="agenda"><h3>${nm(ROOMS[r])}</h3><div class="small mute" style="margin-bottom:8px">${fmtDate(d)} · ${hm(OPEN)}–${hm(CLOSE)}</div>${list.length?list.map(b=>`<div class="slot"><span class="num"><b>${hm(b.start)}–${hm(b.start+b.dur*60)}</b></span><span>${nm(SV[b.service])} · ${esc(b.client.name)} <span class="pill ${b.status}">${t("st")[b.status]}</span><br><span class="small mute">${b.pay==="full"?"100 %":b.pay==="deposit"?"40 %":L()==="fr"?"sur place":"on site"} · ${money(b.paid)} / ${money(b.amount)}</span></span></div>`).join(""):`<div class="empty">${t("noData")}</div>`}</div>`}).join("")}</div>`;}
 if(tab==="req"){const pend=st.bookings.filter(b=>b.status==="pending"),mv=st.bookings.filter(b=>b.move);
  body=`<div class="row" style="margin-bottom:14px"><button class="btn light sm" id="j1">${t("j1")}</button><span class="small mute">${L()==="fr"?"Automatique chaque jour dans la vraie plateforme.":"Runs automatically every day in the real platform."}</span></div>
  <div class="list">${pend.map(b=>`<div class="item"><div><b>${nm(SV[b.service])}</b> <span class="pill pending">${t("st").pending}</span><div class="small mute num">${nm(ROOMS[b.room])} · ${fmtDate(b.date)} · ${hm(b.start)}–${hm(b.start+b.dur*60)} · ${esc(b.client.name)} ${esc(b.client.phone)} · ${money(b.amount)} ${L()==="fr"?"sur place":"on site"}</div></div><div class="acts"><button class="btn ok sm" data-val="${b.id}">${t("validate")}</button><button class="btn bad sm" data-ref="${b.id}">${t("refuse")}</button></div></div>`).join("")}
  ${mv.map(b=>`<div class="item"><div><b>${nm(SV[b.service])}</b> <span class="pill move">${t("st").move}</span><div class="small mute num">${fmtDate(b.date)} ${hm(b.start)} → <b style="color:var(--text)">${fmtDate(b.move.date)} ${hm(b.move.start)}</b> · ${esc(b.client.name)}</div></div><div class="acts"><button class="btn ok sm" data-mvok="${b.id}">${t("accept")}</button><button class="btn bad sm" data-mvno="${b.id}">${t("refuse")}</button></div></div>`).join("")}
  ${!pend.length&&!mv.length?`<div class="empty">${t("noData")}</div>`:""}</div>`;}
 if(tab==="quotes"){body=`<div class="list">${st.quotes.length?st.quotes.map(q=>`<div class="item" style="grid-template-columns:1fr"><div><b>${nm(SV[q.service])}</b> · ${esc(q.offer)} <span class="pill ${q.status}">${t("st")[q.status]}</span><div class="small mute">${esc(q.client.name)} · ${esc(q.client.phone)}</div><p style="margin:8px 0 0">${esc(q.message)}</p>
   ${q.status==="priced"?`<div class="num small">${money(q.price)}</div>`:""}${q.status==="booked"?`<div class="num small" style="color:var(--ok)">${fmtDate(q.chosen.slice(0,10))} ${q.chosen.slice(11,16)}</div>`:""}</div>
   ${q.status==="new"?`<div class="row" style="gap:8px"><button class="btn light sm" data-qprice="${q.id}">${t("sendPrice")}</button><button class="btn ghost sm" data-qmeet="${q.id}">${t("proposeMeet")}</button><button class="btn bad sm" data-qno="${q.id}">${t("impossible")}</button></div>`:""}</div>`).join(""):`<div class="empty">${t("noData")}</div>`}</div>`;}
 if(tab==="orders"){body=`<div class="list">${st.orders.length?st.orders.map(o=>`<div class="item"><div><b class="num">${o.id}</b> · ${esc(o.client.name)} · ${esc(o.client.phone)}<div class="small mute">${o.items.map(i=>nm(SV[i.service])+(i.label?" · "+i.label:"")).join(" · ")}</div></div><b class="num">${money(o.total)}</b></div>`).join(""):`<div class="empty">${t("noData")}</div>`}</div>`;}
 if(tab==="sms"){body=`<p class="small mute">${t("smsDemo")}</p><div class="list">${st.sms.length?st.sms.map(m=>`<div class="sms"><b>${esc(m.to)}</b> · <span class="mute">${esc(m.at)}</span><br>${esc(m.text)}</div>`).join(""):`<div class="empty">${t("noData")}</div>`}</div>`;}
 return `<div class="wrap" style="padding:44px 20px 70px"><h1 style="font-size:2.4rem">${t("admin")}</h1><div class="demo" style="margin-top:12px">${t("adminDemo")}</div>
 <div class="tabs">${tabs.map(([id,n])=>`<button class="chip ${tab===id?"on":""}" data-atab="${id}">${n}</button>`).join("")}</div>${body}</div>`;
}

/* ============ ACTIONS ============ */
function payModal(amount,onOk){
 modal(`<b style="font-family:var(--display);font-size:1.3rem">${t("ctp")}</b><div class="ctp"><div class="hd"><span>Billie Jean Records</span><span class="num">${money(amount)}</span></div><label class="small" for="ctp-n">${t("card")}</label><input id="ctp-n" value="4242 4242 4242 4242" inputmode="numeric"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input value="12/28" aria-label="Expiry"><input value="123" aria-label="CVV"></div></div><span class="small mute">${t("ctpDemo")}</span><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-mclose>${t("cancel")}</button><button class="btn hot" id="ctp-pay">${t("pay")} ${money(amount)}</button></div>`);
 $("#ctp-pay").onclick=()=>{modal("");toast(t("paidOk"));onOk()};
}
function checkout(){
 const name=$("#c-name").value.trim(),phone=$("#c-phone").value.trim(),email=$("#c-email").value.trim();
 st.me={name,phone,email};const T0=totals();
 for(const c of st.cart)if(c.kind==="booking"&&T0.pm!=="onsite"&&!free(c.room,c.date,c.start,c.dur)){toast(t("conflict")+" "+nm(SV[c.service])+" "+hm(c.start));return}
 const finish=()=>{
  const client={name,phone,email};const items=st.cart.filter(c=>c.kind!=="booking");
  for(const c of st.cart.filter(c=>c.kind==="booking")){
   const status=T0.pm==="onsite"?"pending":"confirmed";const paid=T0.pm==="full"?c.price:T0.pm==="deposit"?Math.round(c.price*DEPOSIT*1000)/1000:0;
   const b={id:"B-"+uid(),service:c.service,opt:c.opt,room:c.room,date:c.date,start:c.start,dur:c.dur,pay:T0.pm,status,client,amount:c.price,paid};st.bookings.push(b);
   const when=`${fmtDate(b.date)} ${hm(b.start)}-${hm(b.start+b.dur*60)}`;
   if(status==="confirmed"){sms(phone,`Billie Jean Records: your booking ${b.id} (${nm(SV[b.service])}) on ${when} is confirmed. Paid ${money(paid)} of ${money(b.amount)}.`,`Billie Jean Records : votre réservation ${b.id} (${nm(SV[b.service])}) du ${when} est confirmée. Payé ${money(paid)} sur ${money(b.amount)}.`);sms(STUDIO,`New booking ${b.id}: ${name}, ${when}.`,`Nouvelle réservation ${b.id} : ${name}, ${when}.`)}
   else{sms(phone,`Billie Jean Records: we received your request ${b.id} for ${when}. Online bookings have priority; if the slot is still free the day before, it is confirmed automatically.`,`Billie Jean Records : demande ${b.id} reçue pour le ${when}. Les réservations en ligne sont prioritaires ; si le créneau est encore libre la veille, elle est confirmée automatiquement.`);sms(STUDIO,`New pay-on-site request ${b.id}: ${name}, ${when}.`,`Nouvelle demande sur place ${b.id} : ${name}, ${when}.`)}
  }
  if(items.length){const o={id:"C-"+uid(),client,items:items.map(i=>({service:i.service,label:nm(SV[i.service].offers[i.offer])+(i.qty?" ×"+i.qty:""),price:i.price})),total:items.reduce((a,i)=>a+i.price,0)};st.orders.push(o);
   sms(phone,`Billie Jean Records: payment received for order ${o.id} (${money(o.total)}). We'll contact you to start.`,`Billie Jean Records : paiement reçu pour la commande ${o.id} (${money(o.total)}). Nous vous contactons pour démarrer.`);sms(STUDIO,`New paid order ${o.id}: ${money(o.total)}.`,`Nouvelle commande payée ${o.id} : ${money(o.total)}.`)}
  st.cart=[];save();location.hash="account";render();
 };
 if(T0.now>0)payModal(T0.now,finish);else finish();
}
function quoteModal(sid,i){
 const s=SV[sid],o=s.offers[i],me=st.me||{};
 modal(`<b style="font-family:var(--display);font-size:1.3rem">${t("requestQuote")} · ${nm(s)}</b><span class="small mute">${t("quoteHelp")}</span><form id="qform" style="display:grid;gap:10px"><label class="f" for="q-msg">${t("message")}<textarea class="i" id="q-msg" required></textarea></label><label class="f" for="q-name">${t("name")}<input class="i" id="q-name" required value="${esc(me.name)}"></label><label class="f" for="q-phone">${t("phone")}<input class="i" id="q-phone" required value="${esc(me.phone||"+216 ")}"></label><div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-mclose>${t("cancel")}</button><button class="btn hot">${t("send")}</button></div></form>`);
 $("#qform").onsubmit=e=>{e.preventDefault();const client={name:$("#q-name").value.trim(),phone:$("#q-phone").value.trim()};st.me={...(st.me||{}),...client};
  const q={id:"Q-"+uid(),service:sid,offer:nm(o),client,message:$("#q-msg").value.trim(),status:"new",created:addDays(0)};st.quotes.unshift(q);
  sms(client.phone,`Billie Jean Records: quote request ${q.id} received. We'll reply soon.`,`Billie Jean Records : demande de devis ${q.id} reçue. Nous vous répondons rapidement.`);sms(STUDIO,`New quote request ${q.id} (${nm(s)}) from ${client.name}.`,`Nouvelle demande de devis ${q.id} (${nm(s)}) de ${client.name}.`);
  save();modal("");rerender()};
}
function moveModal(id){
 const b=st.bookings.find(x=>x.id===id);let d=b.date,m=null;
 const draw=()=>{const starts=[];for(let x=OPEN;x<=CLOSE-b.dur*60;x+=30)starts.push(x);
  modal(`<b style="font-family:var(--display);font-size:1.3rem">${t("move")}</b><span class="small mute">${nm(SV[b.service])} · ${b.dur} ${t("hour")}</span><div class="days">${[...Array(14)].map((_,i)=>addDays(i)).map(k=>`<button class="day ${d===k?"on":""}" data-md="${k}"><b class="num">${new Date(k+"T12:00:00").getDate()}</b></button>`).join("")}</div><div class="times">${starts.map(x=>`<button class="time num ${m===x?"on":""}" data-mm="${x}" ${free(b.room,d,x,b.dur,b.id)?"":"disabled"}>${hm(x)}</button>`).join("")}</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-mclose>${t("cancel")}</button><button class="btn hot" id="mv-ok" ${m==null?"disabled":""}>${t("send")}</button></div>`);
  document.querySelectorAll("[data-md]").forEach(e=>e.onclick=()=>{d=e.dataset.md;m=null;draw()});document.querySelectorAll("[data-mm]").forEach(e=>e.onclick=()=>{m=+e.dataset.mm;draw()});
  $("#mv-ok").onclick=()=>{b.move={date:d,start:m};sms(STUDIO,`Change request for ${b.id}: ${fmtDate(d)} ${hm(m)}.`,`Demande de changement pour ${b.id} : ${fmtDate(d)} ${hm(m)}.`);save();modal("");rerender()}};
 draw();
}
function priceModal(id){const q=st.quotes.find(x=>x.id===id);
 modal(`<b style="font-family:var(--display);font-size:1.3rem">${t("sendPrice")} · ${nm(SV[q.service])}</b><form id="pf" style="display:grid;gap:10px"><label class="f" for="p-v">${t("price")} (TND)<input class="i num" id="p-v" type="number" min="1" required value="500"></label><label class="f" for="p-n">Note<input class="i" id="p-n" placeholder="${L()==="fr"?"Ce qui est inclus":"What is included"}"></label><div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-mclose>${t("cancel")}</button><button class="btn hot">${t("sendPrice")}</button></div></form>`);
 $("#pf").onsubmit=e=>{e.preventDefault();q.status="priced";q.price=+$("#p-v").value;q.note=$("#p-n").value;sms(q.client.phone,`Billie Jean Records: your quote ${q.id} is ready: ${money(q.price)}. Accept and pay in your space.`,`Billie Jean Records : votre devis ${q.id} est prêt : ${money(q.price)}. Acceptez et payez dans votre espace.`);save();modal("");rerender()};
}
function meetModal(id){const q=st.quotes.find(x=>x.id===id);const base=[1,1,2,3,4].map((d,i)=>addDays(d)+"T"+["11:00","16:00","14:00","10:30","17:00"][i]);
 modal(`<b style="font-family:var(--display);font-size:1.3rem">${t("proposeMeet")}</b><span class="small mute">${L()==="fr"?"Proposez 4 à 5 créneaux. Le client n'en voit pas d'autres.":"Offer 4 to 5 times. The client only sees these."}</span><form id="mf" style="display:grid;gap:8px">${base.map((v,i)=>`<input class="i num" type="datetime-local" id="m-${i}" value="${v}" aria-label="Slot ${i+1}">`).join("")}<div class="seg"><button type="button" class="on" data-mode="online">${t("online")}</button><button type="button" data-mode="inperson">${t("inperson")}</button></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-mclose>${t("cancel")}</button><button class="btn hot">${t("proposeMeet")}</button></div></form>`);
 let mode="online";document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===b))});
 $("#mf").onsubmit=e=>{e.preventDefault();const slots=base.map((_,i)=>$("#m-"+i).value).filter(Boolean);if(slots.length<4){toast(L()==="fr"?"Proposez au moins 4 créneaux.":"Offer at least 4 times.");return}
  q.status="meeting";q.slots=slots;q.mode=mode;sms(q.client.phone,`Billie Jean Records: your request ${q.id} needs a meeting. Pick a time in your space.`,`Billie Jean Records : votre demande ${q.id} nécessite une réunion. Choisissez un créneau dans votre espace.`);save();modal("");rerender()};
}
function noModal(id){const q=st.quotes.find(x=>x.id===id);
 modal(`<b style="font-family:var(--display);font-size:1.3rem">${t("impossible")}</b><form id="nf" style="display:grid;gap:10px"><label class="f" for="n-r">${L()==="fr"?"Raison (visible par le client)":"Reason (shown to the client)"}<input class="i" id="n-r"></label><div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-mclose>${t("cancel")}</button><button class="btn bad">${t("impossible")}</button></div></form>`);
 $("#nf").onsubmit=e=>{e.preventDefault();q.status="impossible";q.note=$("#n-r").value;sms(q.client.phone,`Billie Jean Records: sorry, we can't take on request ${q.id}.`,`Billie Jean Records : désolé, nous ne pouvons pas réaliser la demande ${q.id}.`);save();modal("");rerender()};
}
function runJ1(){
 const lim=addDays(1);let n=0;
 for(const b of st.bookings.filter(x=>x.status==="pending"&&x.date<=lim)){n++;const when=`${fmtDate(b.date)} ${hm(b.start)}`;
  if(free(b.room,b.date,b.start,b.dur,b.id)||blocking(b.room,b.date,b.id).every(x=>b.start+b.dur*60+BUFFER<=x.start||x.start+x.dur*60+BUFFER<=b.start)){b.status="confirmed";sms(b.client.phone,`Billie Jean Records: your booking ${b.id} on ${when} is now confirmed. Payment at the studio.`,`Billie Jean Records : votre réservation ${b.id} du ${when} est confirmée. Paiement au studio.`)}
  else{b.status="refused";sms(b.client.phone,`Billie Jean Records: sorry, the slot ${when} for ${b.id} was booked online. Please choose another time.`,`Billie Jean Records : désolé, le créneau du ${when} (${b.id}) a été réservé en ligne. Merci d'en choisir un autre.`)}}
 if(!n)toast(t("noData"));save();rerender();
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
 if(e.target.id==="mbg"){modal("");return}
 const el=e.target.closest("button,[data-mclose]");if(!el)return;const d=el.dataset;
 if("mclose" in d){modal("");return}
 if(d.lang){st.lang=d.lang;save();rerender();return}
 if(el.id==="reset"){try{localStorage.removeItem("bjr-demo")}catch(_){}const l=st.lang;st=seed();st.lang=l;save();rerender();toast(t("saved"));return}
 if(d.cat){view.catFilter=d.cat;location.hash="services";return}
 if(d.filter){view.catFilter=d.filter;rerender();return}
 const sid=location.hash.slice(3),b=view.book[sid];
 if(d.bopt!=null){b.opt=+d.bopt;rerender();return}
 if(d.bdate){b.date=d.bdate;b.start=null;rerender();return}
 if(d.bdur){b.dur=Math.max(1,Math.min(12,b.dur+ +d.bdur));rerender();return}
 if(d.bstart){b.start=+d.bstart;rerender();return}
 if(d.addbook){const s=SV[d.addbook];st.cart.push({kind:"booking",service:s.id,opt:b.opt,room:s.room,date:b.date,start:b.start,dur:b.dur,price:priceHours(s.opts[b.opt].r,b.dur)});b.start=null;save();toast(t("added"));rerender();return}
 if(d.add){const [id,i]=d.add.split("|");const o=SV[id].offers[i];let qty=null,price=o.price;if(o.t==="unit"){qty=Math.max(1,+$(`#qty-${id}-${i}`).value||1);price=qty*o.price}
  st.cart.push({kind:"item",service:id,offer:+i,qty,price});save();toast(t("added"));rerender();return}
 if(d.quote){const [id,i]=d.quote.split("|");quoteModal(id,+i);return}
 if(d.rm!=null){st.cart.splice(+d.rm,1);save();rerender();return}
 if(el.id==="logout"){st.me=null;save();rerender();return}
 if(d.move){moveModal(d.move);return}
 if(d.qpay){const q=st.quotes.find(x=>x.id===d.qpay);payModal(q.price,()=>{q.status="paid";st.orders.push({id:"C-"+uid(),client:q.client,items:[{service:q.service,label:q.offer,price:q.price}],total:q.price});sms(q.client.phone,`Billie Jean Records: payment received for quote ${q.id}. Thank you!`,`Billie Jean Records : paiement reçu pour le devis ${q.id}. Merci !`);sms(STUDIO,`Quote ${q.id} paid: ${money(q.price)}.`,`Devis ${q.id} payé : ${money(q.price)}.`);save();rerender()});return}
 if(d.pick){const [id,i]=d.pick.split("|");const q=st.quotes.find(x=>x.id===id);q.chosen=q.slots[+i];q.status="booked";const w=`${fmtDate(q.chosen.slice(0,10))} ${q.chosen.slice(11,16)}`;sms(q.client.phone,`Billie Jean Records: meeting confirmed on ${w}.`,`Billie Jean Records : réunion confirmée le ${w}.`);sms(STUDIO,`Meeting for ${q.id} booked: ${w}.`,`Réunion pour ${q.id} fixée : ${w}.`);save();rerender();return}
 if(d.atab){view.adminTab=d.atab;rerender();return}
 if(d.aday){view.adminDay=d.aday;rerender();return}
 if(d.val){const b=st.bookings.find(x=>x.id===d.val);if(!blocking(b.room,b.date,b.id).every(x=>b.start+b.dur*60+BUFFER<=x.start||x.start+x.dur*60+BUFFER<=b.start)){toast(t("conflict"));return}b.status="confirmed";sms(b.client.phone,`Billie Jean Records: your booking ${b.id} on ${fmtDate(b.date)} ${hm(b.start)} is confirmed. Payment at the studio.`,`Billie Jean Records : votre réservation ${b.id} du ${fmtDate(b.date)} ${hm(b.start)} est confirmée. Paiement au studio.`);save();rerender();return}
 if(d.ref){const b=st.bookings.find(x=>x.id===d.ref);b.status="refused";sms(b.client.phone,`Billie Jean Records: sorry, we can't confirm your request ${b.id}.`,`Billie Jean Records : désolé, nous ne pouvons pas confirmer votre demande ${b.id}.`);save();rerender();return}
 if(d.mvok){const b=st.bookings.find(x=>x.id===d.mvok);if(!free(b.room,b.move.date,b.move.start,b.dur,b.id)){toast(t("conflict"));return}b.date=b.move.date;b.start=b.move.start;b.move=null;sms(b.client.phone,`Billie Jean Records: your booking ${b.id} is moved to ${fmtDate(b.date)} ${hm(b.start)}.`,`Billie Jean Records : votre réservation ${b.id} est déplacée au ${fmtDate(b.date)} ${hm(b.start)}.`);save();rerender();return}
 if(d.mvno){const b=st.bookings.find(x=>x.id===d.mvno);b.move=null;sms(b.client.phone,`Billie Jean Records: we can't move booking ${b.id}; it stays as planned.`,`Billie Jean Records : nous ne pouvons pas déplacer la réservation ${b.id} ; elle reste prévue comme avant.`);save();rerender();return}
 if(d.qprice){priceModal(d.qprice);return}
 if(d.qmeet){meetModal(d.qmeet);return}
 if(d.qno){noModal(d.qno);return}
 if(el.id==="j1"){runJ1();return}
});
document.addEventListener("change",e=>{if(e.target.name==="pm"){view.pay=e.target.value;rerender()}});
document.addEventListener("submit",e=>{
 if(e.target.id==="checkout"){e.preventDefault();checkout()}
 if(e.target.id==="login"){e.preventDefault();st.me={phone:$("#l-phone").value.trim()};save();rerender()}
});
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
